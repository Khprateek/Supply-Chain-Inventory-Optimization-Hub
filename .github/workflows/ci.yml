name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint-and-validate:
    name: Code Quality & Syntax Validation
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff black pytest

      - name: Lint with Ruff
        run: |
          ruff check .

      - name: Check code formatting with Black
        run: |
          black --check .

      - name: Validate Python syntax in scripts & jobs
        run: |
          python -m compileall -q pyspark_jobs/ scripts/ dashboard/ tests/

      - name: Validate dataset schemas & tests
        run: |
          python tests/validate_dataset.py

  docker-compose-validate:
    name: Docker Topology Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: |
          docker compose config --quiet
