    <text x='16' y='44' fill='#94a3b8' font-size='11' font-family='Segoe UI, sans-serif'>122 SKUs • Slow Moving Replenishment</text>
    <text x='724' y='24' fill='#38bdf8' font-size='14' font-weight='bold' font-family='Segoe UI, sans-serif' text-anchor='end'>$90.31 M</text>
    <text x='724' y='44' fill='#64748b' font-size='11' font-family='Segoe UI, sans-serif' text-anchor='end'>0.30% of Value</text>
  </g>

  <!-- Card 3: Moderate Buffer -->
  <g transform='translate(0, 132)'>
    <rect width='740' height='58' rx='8' fill='#15181f' stroke='#262b3d' stroke-width='1'/>
    <text x='16' y='24' fill='#818cf8' font-size='13' font-weight='bold' font-family='Segoe UI, sans-serif'>Moderate Buffer (91–180 Days)</text>
    <text x='16' y='44' fill='#94a3b8' font-size='11' font-family='Segoe UI, sans-serif'>32 SKUs • Balanced Seasonal Safety Stock</text>
    <text x='724' y='24' fill='#818cf8' font-size='14' font-weight='bold' font-family='Segoe UI, sans-serif' text-anchor='end'>$13.22 M</text>
    <text x='724' y='44' fill='#64748b' font-size='11' font-family='Segoe UI, sans-serif' text-anchor='end'>0.04% of Value</text>
  </g>

  <!-- Card 4: Optimal Range -->
  <g transform='translate(0, 198)'>
    <rect width='740' height='58' rx='8' fill='#15181f' stroke='#262b3d' stroke-width='1'/>
    <text x='16' y='24' fill='#10b981' font-size='13' font-weight='bold' font-family='Segoe UI, sans-serif'>Optimal Range (30–90 Days)</text>
    <text x='16' y='44' fill='#94a3b8' font-size='11' font-family='Segoe UI, sans-serif'>10 SKUs • High Velocity FMCG Flow</text>
    <text x='724' y='24' fill='#10b981' font-size='14' font-weight='bold' font-family='Segoe UI, sans-serif' text-anchor='end'>$1.79 M</text>
    <text x='724' y='44' fill='#64748b' font-size='11' font-family='Segoe UI, sans-serif' text-anchor='end'>0.01% of Value</text>
