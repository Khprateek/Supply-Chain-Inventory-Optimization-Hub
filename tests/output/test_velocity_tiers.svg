  <!-- Bottom Callout Banner -->
  <g transform='translate(0, 332)'>
    <rect width='740' height='48' rx='8' fill='#241c0e' stroke='#b45309' stroke-width='1'/>
    <text x='16' y='29' fill='#f59e0b' font-size='11.5' font-weight='600' font-family='Segoe UI, sans-serif'>
      💡 Working Capital Opportunity: <tspan fill='#fed7aa' font-weight='normal'>Throttling replenishment on top 50 excess SKUs releases an estimated $720M over the next 90 days.</tspan>
