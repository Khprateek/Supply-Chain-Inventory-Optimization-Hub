<svg xmlns='http://www.w3.org/2000/svg' width='100%' height='400' viewBox='0 0 740 400'>
  <!-- Card 1: Severe Excess -->
  <g transform='translate(0, 0)'>
    <rect width='740' height='58' rx='8' fill='#15181f' stroke='#262b3d' stroke-width='1'/>
    <text x='16' y='24' fill='#f59e0b' font-size='13' font-weight='bold' font-family='Segoe UI, sans-serif'>Severe Excess (>365 Days)</text>
    <text x='16' y='44' fill='#94a3b8' font-size='11' font-family='Segoe UI, sans-serif'>7,310 SKUs • High Working Capital Lockup</text>
    <text x='724' y='24' fill='#f59e0b' font-size='14' font-weight='bold' font-family='Segoe UI, sans-serif' text-anchor='end'>$29.56 B</text>
    <text x='724' y='44' fill='#64748b' font-size='11' font-family='Segoe UI, sans-serif' text-anchor='end'>99.6% of Value</text>
  </g>

  <!-- Card 2: Surplus Stock -->
  <g transform='translate(0, 66)'>
    <rect width='740' height='58' rx='8' fill='#15181f' stroke='#262b3d' stroke-width='1'/>
