  <!-- Card 5: Stockout Risk -->
  <g transform='translate(0, 264)'>
    <rect width='740' height='58' rx='8' fill='#15181f' stroke='#262b3d' stroke-width='1'/>
    <text x='16' y='24' fill='#f43f5e' font-size='13' font-weight='bold' font-family='Segoe UI, sans-serif'>Low Stock / Stockout Risk (<30 Days)</text>
    <text x='16' y='44' fill='#94a3b8' font-size='11' font-family='Segoe UI, sans-serif'>2 SKUs • Immediate Purchase Order Required</text>
    <text x='724' y='24' fill='#f43f5e' font-size='14' font-weight='bold' font-family='Segoe UI, sans-serif' text-anchor='end'>$72.7 K</text>
    <text x='724' y='44' fill='#f43f5e' font-size='11' font-family='Segoe UI, sans-serif' text-anchor='end'>Critical Alert</text>
